name: Build ATC Calendar APK

on:
  workflow_dispatch:
  push:
    branches: [main, atc-calendar-branding-2026-11-15, atc-calendar-hide-ad-dots-2026-11-15]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python for launcher icon generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate launcher icons from published PWA logo
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python app/scripts/generate_launcher_icons.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check release signing configuration
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: ${{ steps.signing.outputs.ready == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/atc-calendar-upload.jks"
          KEYSTORE_PATH="$RUNNER_TEMP/atc-calendar-upload.jks" gradle --no-daemon :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ATC-Calendar-1.1.1-release.apk

      - name: Build debug APK when release signing is not configured
        if: ${{ steps.signing.outputs.ready != 'true' }}
        run: |
          gradle --no-daemon :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ATC-Calendar-1.1.1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATC-Calendar-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK as GitHub Release
        if: ${{ steps.signing.outputs.ready == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: atc-calendar-v1.1.1-${{ github.run_number }}
          name: ATC Calendar 1.1.1
          files: dist/ATC-Calendar-1.1.1-release.apk
          generate_release_notes: true
